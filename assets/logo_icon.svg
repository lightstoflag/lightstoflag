<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14263d"/><stop offset="1" stop-color="#0a1422"/>
    </linearGradient>
    <clipPath id="flagClip"><path d="M86 16 Q 98 11 108 16 T 122 16 V 40 Q 110 35 100 40 T 86 40 Z"/></clipPath>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- start lights -->
  <rect x="12" y="92" width="62" height="20" rx="10" fill="#060c15"/>
  <g fill="#e34948">
    <circle cx="22" cy="102" r="5"/><circle cx="33" cy="102" r="5"/><circle cx="43" cy="102" r="5"/>
    <circle cx="53" cy="102" r="5"/><circle cx="64" cy="102" r="5"/>
  </g>
  <!-- racing line from lights to flag -->
  <path d="M74 102 C 100 100, 96 74, 74 66 S 50 44, 86 42" fill="none" stroke="#ffffff"
        stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M74 102 C 100 100, 96 74, 74 66 S 50 44, 86 42" fill="none" stroke="#e34948"
        stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 6"/>
  <!-- chequered flag -->
  <rect x="83" y="12" width="4" height="56" rx="2" fill="#c3c2b7"/>
  <g clip-path="url(#flagClip)">
    <rect x="86" y="10" width="38" height="34" fill="#0b0b0b"/>
    <g fill="#ffffff">
      <rect x="86" y="10" width="6" height="6"/><rect x="98" y="10" width="6" height="6"/><rect x="110" y="10" width="6" height="6"/>
      <rect x="92" y="16" width="6" height="6"/><rect x="104" y="16" width="6" height="6"/><rect x="116" y="16" width="6" height="6"/>
      <rect x="86" y="22" width="6" height="6"/><rect x="98" y="22" width="6" height="6"/><rect x="110" y="22" width="6" height="6"/>
      <rect x="92" y="28" width="6" height="6"/><rect x="104" y="28" width="6" height="6"/><rect x="116" y="28" width="6" height="6"/>
      <rect x="86" y="34" width="6" height="6"/><rect x="98" y="34" width="6" height="6"/><rect x="110" y="34" width="6" height="6"/>
      <rect x="92" y="40" width="6" height="6"/><rect x="104" y="40" width="6" height="6"/><rect x="116" y="40" width="6" height="6"/>
    </g>
  </g>
</svg>
